workflows:
  ios-workflow:
    name: Huruf App iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.aladdoalhurof.app"
    scripts:
      - name: Install Cordova
        script: |
          npm install -g cordova@13.0.0
      - name: Install Dependencies
        script: |
          npm install
      - name: Add iOS Platform
        script: |
          cordova platform add ios
      - name: Build iOS
        script: |
          cordova build ios --release --no-telemetry
    artifacts:
      - platforms/ios/build/device/*.ipa
      - platforms/ios/build/device/*.app
