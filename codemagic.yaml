workflows:
  ios-workflow:
    name: Huruf App iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.aladdoalhurof.app"
    scripts:
      - name: Install Cordova
        script: |
          npm install -g cordova@13.0.0
      - name: Install Dependencies
        script: |
          npm install
      - name: Add iOS Platform
        script: |
          cordova platform add ios
      - name: Build iOS (Direct Unsigned Build)
        script: |
          cd platforms/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_ENTITLEMENTS=""
      - name: Create Unsigned IPA
        script: |
          cd platforms/ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r App.ipa Payload
    artifacts:
      - platforms/ios/build/Build/Products/Release-iphoneos/*.ipa
