workflows:
  ios-workflow:
    name: Huruf App iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.aladdoalhurof.app"
    scripts:
      - name: Install Cordova
        script: |
          npm install -g cordova@13.0.0
      - name: Install Dependencies
        script: |
          npm install
      - name: Add iOS Platform
        script: |
          cordova platform add ios
      - name: Build iOS (Unsigned Archive)
        script: |
          cd platforms/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_ENTITLEMENTS="" archive
      - name: Create Unsigned IPA
        script: |
          cd platforms/ios
          xcodebuild -exportArchive -archivePath App.xcarchive -exportPath ./build/device -exportOptionsPlist /dev/null
          # Alternative manual method to create IPA
          mkdir -p ./build/device/Payload
          cp -r App.xcarchive/Products/Applications/App.app ./build/device/Payload/
          cd ./build/device
          zip -r App.ipa Payload
    artifacts:
      - platforms/ios/build/device/*.ipa
